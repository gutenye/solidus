version: "3.9"

services:
  app:
    build: .
    image: gutenye/solidus
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://solidus:solidus@db:5432/solidus
    ports:
      - "4001:3000"
    volumes:
      - ./production.rb:/app/config/environments/production.rb
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: solidus
      POSTGRES_USER: solidus
      POSTGRES_PASSWORD: solidus
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solidus -d solidus"]
      interval: 5s
      timeout: 5s
      retries: 30
